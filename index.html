    <style>
      * {padding: 0;margin: 0; box-sizing: border-box; font-size: 14px; font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif; color: #333}
      body {background: #f8f8f8; }
      .container {background: #f8f8f8; padding: 10px; overflow: hidden}
      .content {background: #fff; border-radius: 8px; padding: 20px 10px; overflow: hidden; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); margin: 0 auto; width: 100%; max-width: 600px;}
      .avatar {text-align: center;}
      .a-img {width: 150px; height: 150px; border-radius: 10px; margin: 0 auto; position: relative}
      .a-img::after {content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.02); border-radius: 10px; }
      .avatar-img {width: 150px; height: 150px; border-radius: 10px; margin: 0 auto; display: block; object-fit: cover;}
      .info {display: flex; flex-direction: column; margin-top: 15px; }
      .info-item {display: flex; margin-top: 15px; font-size: 16px; line-height: 25px;}
        .info-item .item-label {width: 90px; min-width: 90px; max-width: 90px; color: #999; white-space: nowrap; text-align-last: justify; font-size: 16px; line-height: 25px;}
        .info-item .item-point {width: 14px; min-width: 14px; max-width: 14px; color: #999; white-space: nowrap;}
      .info-item .item-value {font-size: 16px; line-height: 25px;color: #333}
    </style>
  </head>
  <body>
  <div class="container"></div>
  </body>
    <script id="contentTpl" type="application/template">
        <div class="content">
            <div class="avatar">
                <div class="a-img">
                    <img src="#avatarUrl#" class="avatar-img" />
                </div>
            </div>
            <div class="info">
                <div class="info-item">
                    <div class="item-label">姓名</div>
                    <div class="item-point">：</div>
                    <div class="item-value">#name#</div>
                </div>
                <div class="info-item">
                    <div class="item-label">身份证号码</div>
                    <div class="item-point">：</div>
                    <div class="item-value">#cardId#</div>
                </div>
                <div class="info-item">
                    <div class="item-label">证书编号</div>
                    <div class="item-point">：</div>
                    <div class="item-value">#certNo#</div>
                </div>
                <div class="info-item">
                    <div class="item-label">培训基地</div>
                    <div class="item-point">：</div>
                    <div class="item-value">#stationName#</div>
                </div>
                <div class="info-item">
                    <div class="item-label">培训时间</div>
                    <div class="item-point">：</div>
                    <div class="item-value">#pxTimeText#</div>
                </div>
                <div class="info-item">
                    <div class="item-label">发证单位</div>
                    <div class="item-point">：</div>
                    <div class="item-value">#certStationName#</div>
                </div>
            </div>
        </div>
    </script>
